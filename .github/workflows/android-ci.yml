name: Android CI (Unzip + Build + Test)

"on":
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    # All later steps run inside the folder that comes out of the zip
    # (the zip's top-level folder is "MBC-ERP-Android").
    defaults:
      run:
        working-directory: MBC-ERP-Android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: .

      - name: Unzip the project
        working-directory: .
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No .zip file found at repo root!"
            exit 1
          fi
          echo "Unzipping: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d .
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          validate-wrappers: false

      - name: Generate the missing Gradle wrapper jar
        run: gradle wrapper --gradle-version 8.7

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mbc-erp-debug-apk
          path: MBC-ERP-Android/app/build/outputs/apk/debug/*.apk

      - name: Upload unit test report (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: MBC-ERP-Android/app/build/reports/tests/testDebugUnitTest/
