name: Android CI (Unzip + Build + Test)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            ls -la
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          unzip -o "$ZIP_FILE" -d extracted

          echo "Extraction completed."
          find extracted -maxdepth 4 -type f | sort | head -300

      - name: Detect Android project automatically
        id: project
        shell: bash
        run: |
          set -e

          echo "Searching for Gradle settings file..."

          SETTINGS=$(find extracted \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts was not found."
            echo "Extracted structure:"
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS")

          echo "Android project detected at:"
          echo "$PROJECT_ROOT"

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Verify Android project
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -e

          echo "Project root:"
          pwd

          echo "Project files:"
          ls -la

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: Gradle settings file missing."
            exit 1
          fi

          echo "ANDROID PROJECT VERIFIED"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"
          validate-wrappers: false

      - name: Prepare Gradle wrapper
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -e

          if [ ! -f "./gradlew" ]; then
            echo "gradlew missing."
            echo "Generating Gradle wrapper..."

            gradle wrapper --gradle-version 8.7
          fi

          chmod +x ./gradlew

          ./gradlew --version

      - name: Run unit tests
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"
          find extracted \
            -type f \
            -path "*/build/outputs/apk/**/*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mbc-erp-debug-apk
          path: |
            extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            extracted/**/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
