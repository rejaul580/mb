name: Extract ZIP & Build APK

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: রিপো চেকআউট
        uses: actions/checkout@v4

      - name: ZIP খুঁজে বের করে extract করা
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "কোনো .zip ফাইল পাওয়া যায়নি!"
            exit 1
          fi
          echo "পাওয়া গেছে: $ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Gradle প্রজেক্টের রুট ফোল্ডার খুঁজে বের করা
        run: |
          PROJECT_DIR=$(find extracted -maxdepth 4 -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle.kts পাওয়া যায়নি — এটা কি Android/Gradle প্রজেক্ট?"
            exit 1
          fi
          echo "প্রজেক্ট রুট: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: JDK 17 সেটআপ
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle সেটআপ (wrapper না থাকলেও চলবে)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Unit টেস্ট রান (থাকলে)
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle testDebugUnitTest --continue || true

      - name: Debug APK বিল্ড
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug

      - name: APK আপলোড (Artifacts থেকে ডাউনলোড করা যাবে)
        uses: actions/upload-artifact@v4
        with:
          name: mbc-erp-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
