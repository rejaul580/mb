name: Build MBC ERP Final v7

"on":
  push:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug — list repo contents
        run: |
          echo "রেপোর root:"
          ls -la
          echo ""
          echo "সব .zip ফাইল:"
          find . -iname "*.zip"

      - name: Extract MBC-ERP-Android-Final-7.zip
        run: |
          ZIP_FILE=$(find . -iname "MBC-ERP-Android-Final-7.zip" | head -n1)
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ MBC-ERP-Android-Final-7.zip পাওয়া যায়নি। উপরের Debug step-এর 'ls -la' দেখুন।"
            exit 1
          fi
          echo "ব্যবহার হচ্ছে: $ZIP_FILE"
          rm -rf extracted
          mkdir -p extracted
          unzip -o -q "$ZIP_FILE" -d extracted
          echo "extracted-এর ভেতরে:"
          find extracted -maxdepth 2
          PROJECT_DIR=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "প্রজেক্ট ফোল্ডার: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          validate-wrappers: false

      - name: Generate the missing Gradle wrapper (if needed)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mbc-erp-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk

      - name: Upload unit test report (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: ${{ env.PROJECT_DIR }}/app/build/reports/tests/testDebugUnitTest/
